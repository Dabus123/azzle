specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TaskRegistry
    network: base
    source:
      address: "0x0a47c3a2d515ec3a23f225a7bac1b0a1654e4d48"
      abi: TaskRegistry
      startBlock: 46871267
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Task
        - Agent
        - Dispute
      abis:
        - name: TaskRegistry
          file: ./abis/TaskRegistry.json
        - name: EscrowVault
          file: ./abis/EscrowVault.json
        - name: ArbitrationModule
          file: ./abis/ArbitrationModule.json
      eventHandlers:
        - event: TaskPosted(indexed uint256,indexed address,bytes32)
          handler: handleTaskPosted
        - event: TaskCreated(indexed uint256,indexed address,indexed address,bytes32)
          handler: handleTaskCreated
        - event: TaskClaimed(indexed uint256,indexed address)
          handler: handleTaskClaimed
        - event: TaskStateChanged(indexed uint256,uint8)
          handler: handleTaskStateChanged
        - event: ProofSubmitted(indexed uint256,uint256,bytes32)
          handler: handleProofSubmitted
        - event: WorkerReplaced(indexed uint256,address,address)
          handler: handleWorkerReplaced
      file: ./src/mapping.ts

  - kind: ethereum
    name: EscrowVault
    network: base
    source:
      address: "0xd1f3058650ab22250d139dba5b2b48118071dc36"
      abi: EscrowVault
      startBlock: 46871267
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Task
        - Agent
      abis:
        - name: EscrowVault
          file: ./abis/EscrowVault.json
        - name: TaskRegistry
          file: ./abis/TaskRegistry.json
      eventHandlers:
        - event: MilestoneReleased(indexed uint256,uint256,uint256)
          handler: handleMilestoneReleased
      file: ./src/mapping.ts

  - kind: ethereum
    name: ArbitrationModule
    network: base
    source:
      address: "0x1CFc919cA2C5eaD0A5b3365260c091AD7E1a31E0"
      abi: ArbitrationModule
      startBlock: 46871267
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Task
        - Agent
        - Dispute
      abis:
        - name: ArbitrationModule
          file: ./abis/ArbitrationModule.json
        - name: TaskRegistry
          file: ./abis/TaskRegistry.json
      eventHandlers:
        - event: DisputeOpened(indexed uint256,indexed uint256,address)
          handler: handleDisputeOpened
        - event: DisputeResolved(indexed uint256,uint256)
          handler: handleDisputeResolved
      file: ./src/mapping.ts

  - kind: ethereum
    name: ReputationRegistry
    network: base
    source:
      address: "0x462dCB4903583D99889f4aD42C4c5008A519082a"
      abi: ReputationRegistry
      startBlock: 46871267
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Agent
        - ReputationSignal
      abis:
        - name: ReputationRegistry
          file: ./abis/ReputationRegistry.json
      eventHandlers:
        - event: ReputationSignalEmitted(indexed uint256,indexed address,uint8,uint256)
          handler: handleReputationSignalEmitted
        - event: VerifierBondStaked(indexed address,uint256,uint256)
          handler: handleVerifierBondStaked
      file: ./src/mapping.ts
