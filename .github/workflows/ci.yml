name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run test:v2
      - run: npm run typecheck

  fork:
    runs-on: ubuntu-latest
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run fork:check
        if: ${{ env.BASE_RPC_URL != '' }}
      - run: echo "Skipping live Base manifest check because BASE_RPC_URL is not configured."
        if: ${{ env.BASE_RPC_URL == '' }}

  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agents/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run validate:schemas

  surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run sync:manifest-surfaces
      - run: npm run check:protocol-surface
      - run: npm run build
