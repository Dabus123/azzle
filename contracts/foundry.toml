[profile.default]
src = "src/v2"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 1
via_ir = true
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[profile.fuzz]
