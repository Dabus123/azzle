services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azzle
      POSTGRES_PASSWORD: azzle
      POSTGRES_DB: azzle_force
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/azzleforce
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]

  temporal:
    image: temporalio/auto-setup:1.25.2
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=azzle
      - POSTGRES_PWD=azzle
      - POSTGRES_SEEDS=postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
