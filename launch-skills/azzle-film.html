// ── NOISE ──
function noise(){
  const id=X.createImageData(W(),H()), d=id.data;
  for(let i=0;i<500;i++){const p=(Math.floor(Math.random()*H())*W()+Math.floor(Math.random()*W()))*4;const v=Math.random()*20;d[p]=v;d[p+1]=v;d[p+2]=v;d[p+3]=Math.random()*40;}
  X.putImageData(id,0,0);
}

const PALS={

  plasma:{o:'#080030',m:'#2200aa',i:'#6611ee',c:'#bb77ff',t:'#eeddff',b:'#9944ff'},

function bolt(sx,sy,ang,len,col,alp){
  const segs=5+Math.floor(Math.random()*5);
  let cx=sx,cy=sy;
  X.beginPath();X.moveTo(cx,cy);
  for(let i=0;i<segs;i++){
    const fr=(i+1)/segs;
    const bx=sx+Math.cos(ang)*len*fr, by=sy+Math.sin(ang)*len*fr;
    const p=ang+Math.PI/2, j=(Math.random()-0.5)*len*0.38;
    cx=bx+Math.cos(p)*j; cy=by+Math.sin(p)*j;
    X.lineTo(cx,cy);
    if(Math.random()>0.6){
      const ba=ang+(Math.random()-0.5)*1.4;
      X.save();X.beginPath();X.moveTo(cx,cy);
      let bx2=cx,by2=cy;
      for(let k=0;k<3;k++){bx2+=Math.cos(ba)*len*0.15*(Math.random()+0.3);by2+=Math.sin(ba)*len*0.15*(Math.random()+0.3);X.lineTo(bx2,by2);}
      X.strokeStyle=col;X.lineWidth=0.6;X.globalAlpha=alp*0.4;X.shadowBlur=6;X.shadowColor=col;X.stroke();
      X.restore();
    }
  }
  X.strokeStyle=col;X.lineWidth=0.8+Math.random()*1.5;
  X.globalAlpha=alp*(0.3+Math.random()*0.7);
  X.shadowBlur=12;X.shadowColor=col;X.stroke();
  X.globalAlpha=1;X.shadowBlur=0;
}

function elText(txt,x,y,fs,inten,pal,t){
  if(!txt)return;
  X.save();
  X.font=F_BIG(fs);X.textAlign='center';X.textBaseline='middle';
  const passes=[
    {blur:fs*1.4,a:0.12*inten,c:pal.o},
    {blur:fs*0.9,a:0.22*inten,c:pal.m},
    {blur:fs*0.45,a:0.38*inten,c:pal.i},
    {blur:fs*0.2, a:0.6*inten, c:pal.c},
    {blur:fs*0.07,a:0.85,      c:pal.t},
  ];
  for(const p of passes){X.shadowBlur=p.blur;X.shadowColor=p.c;X.globalAlpha=p.a;X.fillStyle=p.c;X.fillText(txt,x,y);}
  // bolts
  const bc=Math.floor(8*inten);
  for(let b=0;b<bc;b++){
    const ang=(b/bc)*Math.PI*2+t*1.2+b*0.7;
    const len=fs*(0.3+Math.random()*0.6)*inten;
    const ox=x+Math.cos(ang)*fs*0.5, oy=y+Math.sin(ang)*fs*0.32;
    bolt(ox,oy,ang,len,pal.b,inten*0.7);
  }
  X.shadowBlur=0;X.globalAlpha=1;X.fillStyle='#000';X.fillText(txt,x,y);
  X.restore();
}

// ── LOGO DRAWERS ──
function drawAzzleIcon(cx,cy,sz,glowing,t){
  // Draw the Azzle "A" with network nodes — stylized from their logo
  X.save();
  const s=sz;
  // Glow
  if(glowing){
    X.shadowBlur=40;X.shadowColor='#e8a000';
    const g=X.createRadialGradient(cx,cy,0,cx,cy,sz*0.8);
    g.addColorStop(0,'rgba(255,200,0,0.15)');g.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=g;X.fillRect(cx-sz,cy-sz,sz*2,sz*2);
  }
  X.shadowBlur=glowing?20:0;X.shadowColor='#ffcc00';
  const col=glowing?'#ffe055':'#ffffff';
  X.fillStyle=col;X.strokeStyle=col;
  // A shape (rounded, like their logo)
  const aW=s*0.55, aH=s*0.65;
  X.lineWidth=s*0.12;X.lineCap='round';X.lineJoin='round';
  // Left leg
  X.beginPath();
  X.moveTo(cx-aW*0.5, cy+aH*0.5);
  X.lineTo(cx, cy-aH*0.5);
  X.lineTo(cx+aW*0.5, cy+aH*0.5);
  X.lineWidth=s*0.13;X.stroke();
  // Crossbar
  X.beginPath();X.moveTo(cx-aW*0.25,cy+aH*0.1);X.lineTo(cx+aW*0.25,cy+aH*0.1);X.lineWidth=s*0.09;X.stroke();
  // Network nodes
  const nodes=[
    [cx, cy-aH*0.5],           // apex
    [cx-aW*0.37, cy-aH*0.08],  // left mid
    [cx+aW*0.37, cy-aH*0.08],  // right mid
    [cx, cy+aH*0.1],            // crossbar center
    [cx-aW*0.5, cy+aH*0.5],    // bottom left
    [cx+aW*0.5, cy+aH*0.5],    // bottom right
    [cx-aW*0.6, cy+aH*0.0],    // outer left
    [cx+aW*0.6, cy+aH*0.0],    // outer right
  ];
  const r=s*0.045;
  X.fillStyle=col;
  for(const [nx,ny] of nodes){
    if(glowing){X.shadowBlur=15;X.shadowColor='#ffee00';}
    X.beginPath();X.arc(nx,ny,r,0,Math.PI*2);X.fill();
  }
  // connector lines between nodes (thin)
  const conns=[[0,1],[0,2],[1,3],[2,3],[1,6],[2,7],[3,4],[3,5]];
  X.lineWidth=s*0.025;X.globalAlpha=0.5;
  for(const [a,b] of conns){
    X.beginPath();X.moveTo(nodes[a][0],nodes[a][1]);X.lineTo(nodes[b][0],nodes[b][1]);X.stroke();
  }
  X.globalAlpha=1;X.restore();
}

function drawBaseIcon(cx,cy,sz,t){
  X.save();
  // Blue square + "base" wordmark style
  const bsz=sz*0.4;
  // Glow
  X.shadowBlur=30;X.shadowColor=BASE_BLUE;
  X.fillStyle=BASE_BLUE;
  X.fillRect(cx-bsz*2.5, cy-bsz*0.5, bsz, bsz);
  X.shadowBlur=0;
  // "base" text
  X.font=`900 ${bsz*1.1}px 'Bebas Neue', sans-serif`;
  X.textAlign='left';X.textBaseline='middle';
  X.fillStyle='#fff';
  X.fillText('base', cx-bsz*1.3, cy);
  X.restore();
}

function drawXMTPIcon(cx,cy,sz,t){
  X.save();
  // Circle with X inside (their logo)
  const r=sz*0.38;
  X.shadowBlur=20;X.shadowColor='#fff';
  X.strokeStyle='#fff';X.lineWidth=sz*0.07;
  // Incomplete circle (like their logo, gap at bottom right)
  X.beginPath();X.arc(cx,cy,r, 0.25*Math.PI, 1.75*Math.PI);X.stroke();
  // X inside
  const xi=sz*0.18;
  X.lineWidth=sz*0.1;X.lineCap='round';
  X.beginPath();X.moveTo(cx-xi,cy-xi);X.lineTo(cx+xi,cy+xi);X.stroke();
  X.beginPath();X.moveTo(cx+xi,cy-xi);X.lineTo(cx-xi,cy+xi);X.stroke();
  X.shadowBlur=0;
  // label
  X.font=F_MONO(sz*0.18);X.textAlign='center';X.textBaseline='top';
  X.fillStyle='#888';X.fillText('XMTP', cx, cy+r*1.15);
  X.restore();
}

// ── CREDIT CARD (Enter the Void style) ──
// Outlined big text + colored sub lines
function drawCreditCard(lines, t){
  // lines: [{text, style:'outlined'|'solid'|'small', color, size}]
  const cx=W()/2, cy=H()/2;
  let totalH=0;
  const rendered=lines.map(l=>{
    const fs=l.size||clampFont(l.style);
    return{...l,fs};
  });
  // measure
  let y=cy - rendered.reduce((a,l)=>a+l.fs*1.15,0)/2;
  for(const l of rendered){
    X.save();
    X.font=F_BIG(l.fs);X.textAlign='center';X.textBaseline='top';
    if(l.style==='outlined'){
      X.strokeStyle=l.color||ORANGE;
      X.lineWidth=Math.max(2,l.fs*0.04);
      X.strokeText(l.text, cx, y);
    } else {
      X.fillStyle=l.color||WHITE;
      X.fillText(l.text, cx, y);
    }
    if(l.style==='small'){
      X.font=F_MONO(l.fs);
      X.fillStyle=l.color||ORANGE;
      X.fillText(l.text, cx, y);
    }
    X.restore();
    y+=l.fs*1.15;
  }
}

function clampFont(style){
  if(style==='outlined') return Math.min(W()*0.18,210);
  if(style==='solid') return Math.min(W()*0.12,140);
  if(style==='small') return Math.min(W()*0.03,22);
  return Math.min(W()*0.06, 50);
}

// ── PARTICLES ──
class Ptcl{
  constructor(pal){this.p=pal;this.r();}
  r(){this.x=Math.random()*W();this.y=H()+10;this.vy=-(Math.random()*2+0.3);this.vx=(Math.random()-0.5)*0.7;this.life=1;this.dec=Math.random()*0.006+0.002;this.sz=Math.random()*3+0.5;this.col=this.p.c;}
  upd(){this.x+=this.vx;this.y+=this.vy;this.life-=this.dec;}
  drw(){X.globalAlpha=this.life*0.5;X.fillStyle=this.col;X.shadowBlur=7;X.shadowColor=this.col;X.beginPath();X.arc(this.x,this.y,this.sz*this.life,0,Math.PI*2);X.fill();X.globalAlpha=1;X.shadowBlur=0;}
}
let ptcls=[];
function spawnP(pal,n){for(let i=0;i<n;i++)ptcls.push(new Ptcl(PALS[pal]));if(ptcls.length>400)ptcls.splice(0,ptcls.length-400);}
function updP(){for(let i=ptcls.length-1;i>=0;i--){ptcls[i].upd();if(ptcls[i].life<=0){ptcls.splice(i,1);continue;}ptcls[i].drw();}}

// ── RENDER ──
let startTime=null, lastIdx=-1, curSc=null, raf=null;

function getElFS(sc){
  const vw=W()*0.16, max=200, min=50;
  return Math.max(min,Math.min(vw,max));
}

function renderScene(sc, elapsed){
  const t=elapsed*0.001;
  X.globalAlpha=1;
  X.fillStyle='#000';
  X.fillRect(0,0,W(),H());
  noise();

  if(!sc||sc.type==='black') return;
  if(sc.type==='flash') return;

  const cx=W()/2, cy=H()/2;

  if(sc.type==='electric'){
    const pal=PALS[sc.pal||'fire'];
    const inten=sc.inten||0.8;
    const fs=getElFS(sc);
    // BG corona
    const pulse=0.8+0.2*Math.sin(t*3.5);
    const g=X.createRadialGradient(cx,cy,0,cx,cy,W()*0.65);
    g.addColorStop(0,hexA(pal.m,0.13*inten*pulse));
    g.addColorStop(0.6,hexA(pal.o,0.05*inten));
    g.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=g;X.fillRect(0,0,W(),H());
    // screen bolts
    const ac=Math.floor(4*inten*(0.5+0.5*Math.abs(Math.sin(t*11))));
    for(let a=0;a<ac;a++){
      const sx=cx+(Math.random()-0.5)*fs*1.8, sy=cy+(Math.random()-0.5)*fs*0.7;
      bolt(sx,sy,Math.random()*Math.PI*2,fs*(0.3+Math.random()*0.9)*inten,pal.b,0.45*inten);
    }
    const hasW2=sc.w2&&sc.w2.length>0;
    const y1=hasW2?cy-fs*0.55:cy;
    if(sc.w1) elText(sc.w1,cx,y1,fs,inten,pal,t);
    if(hasW2) elText(sc.w2,cx,cy+fs*0.44,fs*0.42,inten*0.72,pal,t);
    if(sc.drawIcon){
      // Draw Azzle A icon bottom center area
      drawAzzleIcon(cx, cy+fs*1.1, fs*0.55, true, t);
    }
    if(sc.spawnP) spawnP(sc.pal,15);
    return;
  }

  if(sc.type==='text'||sc.type==='credit'){
    const lines=sc.lines||[];
    // measure total height
    let totalH=0;
    const mlines=lines.map(l=>{
      const fs=l.size!=null?l.size:(l.style==='outlined'?Math.min(W()*0.17,200):l.style==='small'?Math.min(W()*0.025,22):Math.min(W()*0.065,60));
      totalH+=fs*1.25;
      return{...l,fs};
    });
    let y=cy-totalH/2;
    for(const l of mlines){
      X.save();
      if(l.style==='outlined'){
        X.font=F_BIG(l.fs);X.textAlign='center';X.textBaseline='top';
        X.shadowBlur=0;X.globalAlpha=1;
        X.strokeStyle=l.color||ORANGE;X.lineWidth=Math.max(1.5,l.fs*0.038);
        X.strokeText(l.text,cx,y);
      } else if(l.style==='small'){
        X.font=F_MONO(l.fs);X.textAlign='center';X.textBaseline='top';
        X.fillStyle=l.color||ORANGE;X.fillText(l.text,cx,y);
      } else {
        X.font=F_BIG(l.fs);X.textAlign='center';X.textBaseline='top';
        X.fillStyle=l.color||WHITE;X.fillText(l.text,cx,y);
      }
      X.restore();
      y+=l.fs*1.25;
    }
    return;
  }

  if(sc.type==='logo'){
    const logoSz=Math.min(W()*0.18,140);
    const logoY=cy-logoSz*0.3;
    if(sc.logo==='base') drawBaseIcon(cx,logoY,logoSz,t);
    if(sc.logo==='xmtp') drawXMTPIcon(cx,logoY,logoSz,t);
    if(sc.logo==='azzle') drawAzzleIcon(cx,logoY,logoSz,false,t);
    // sub lines
    const lines=sc.lines||[];
    let y=logoY+logoSz*0.85;
    for(const l of lines){
      const fs=l.size||22;
      X.save();
      X.font=l.style==='small'?F_MONO(fs):F_BIG(fs);
      X.textAlign='center';X.textBaseline='top';
      X.fillStyle=l.color||WHITE;
      X.fillText(l.text,cx,y);
      X.restore();
      y+=fs*1.4;
    }
    return;
  }

  if(sc.type==='endlogos'){
    // Throbbing Gristle style — all stack logos on one card
    const top=cy-H()*0.3;
    // Title
    X.font=F_MONO(Math.min(W()*0.02,18));
    X.textAlign='center';X.textBaseline='top';
    X.fillStyle=ORANGE;
    X.fillText('BUILT WITH', cx, top);
    // Three logos side by side
    const lsz=Math.min(W()*0.12,90);
    const gap=W()*0.28;
    drawAzzleIcon(cx-gap, top+lsz*1.5, lsz, false, t);
    drawBaseIcon(cx, top+lsz*1.5, lsz*0.85, t);
    drawXMTPIcon(cx+gap, top+lsz*1.5, lsz, t);
    // Labels
    X.font=F_MONO(Math.min(W()*0.015,14));
    X.textAlign='center';X.textBaseline='top';
    X.fillStyle=ORANGE;
    const ly=top+lsz*3;
    X.fillText('AZZLE',cx-gap,ly);
    X.fillText('BASE',cx,ly);
    X.fillText('XMTP',cx+gap,ly);
    // Bottom line
    X.font=F_MONO(Math.min(W()*0.013,12));
    X.fillStyle='#333';
    X.fillText('OPEN PROTOCOL · MIT LICENSE · LIVE ON BASE (8453)', cx, top+lsz*3.8);
    return;
  }
}

function hexA(hex,alpha){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

function tick(now){
  if(!startTime) startTime=now;
  const el=now-startTime;
  document.getElementById('progb').style.width=Math.min(el/TOTAL*100,100)+'%';

  let ai=-1;
  for(let i=0;i<scenes.length;i++){if(el>=scenes[i].t&&el<scenes[i].t+scenes[i].d){ai=i;break;}}
  if(ai!==lastIdx){
    lastIdx=ai;curSc=ai>=0?scenes[ai]:null;
    if(curSc?.type==='flash') flash(55);
  }
  renderScene(curSc,el);
  updP();
  if(el>=TOTAL){endTrailer();return;}
  raf=requestAnimationFrame(tick);
}

function startTrailer(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('prog').style.opacity='1';
  startTime=null;lastIdx=-1;ptcls=[];
  raf=requestAnimationFrame(tick);
}
function endTrailer(){
  cancelAnimationFrame(raf);
  const e=document.getElementById('end');
  e.style.display='flex';setTimeout(()=>e.style.opacity='1',100);
}
